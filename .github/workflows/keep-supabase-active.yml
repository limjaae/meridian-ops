name: Keep Supabase database active

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  ping-production:
    runs-on: ubuntu-latest
    steps:
      - name: Query the live API so the database sees real traffic
        run: |
          base="https://jasonlim.tech/meridian-operations/api"
          for route in ports suppliers incidents decisions; do
            body=$(curl --fail --silent --show-error "$base/$route")
            echo "$route: ${#body} bytes"
            # A 200 with an error payload would still mean the database is down.
            if echo "$body" | grep -q '"error"'; then
              echo "::error::$route returned an error payload: $body"
              exit 1
            fi
          done
          echo "All routes healthy at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
